<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Status do Suporte</title>
    <link rel="stylesheet" href="/vendor/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="/vendor/inter/400.css">
    <link rel="stylesheet" href="/vendor/inter/500.css">
    <link rel="stylesheet" href="/vendor/inter/600.css">
    <link rel="stylesheet" href="/vendor/inter/700.css">
    <link rel="stylesheet" href="/vendor/fontawesome/css/all.min.css">
    <link rel="stylesheet" href="/styles/base.css">
    <link rel="stylesheet" href="/pages/overview/overview.css">
    <link rel="icon" href="/assets/logo.svg" type="image/svg+xml">
    <script src="/common/protocol.js"></script>
    <script src="/common/format.js"></script>
    <script src="/socket.io/socket.io.js"></script>
</head>
<body>
    <div id="sidebar-container"></div>

    <div class="content initial-page">
        <div class="header">
            <button class="toggle-btn" type="button" aria-label="Alternar menu"><i class="fas fa-bars"></i></button>
            <h2>Status do Suporte</h2>
        </div>
        <div class="row g-4">
            <div class="col-lg-4">
                <div class="card initial-status-card">
                    <div class="status-header"><i class="fas fa-headset"></i> Atendimentos Ativos</div>
                    <div id="active-chat-list" class="initial-list-container">
                        <div class="empty-message">Nenhum atendimento ativo.</div>
                    </div>
                </div>
            </div>
            <div class="col-lg-4">
                <div class="card initial-status-card">
                    <div class="status-header"><i class="fas fa-users"></i> Fila de Espera</div>
                    <div id="waiting-list-container" class="initial-list-container">
                        <div class="empty-message">Nenhum usuário na fila.</div>
                    </div>
                </div>
            </div>
            <div class="col-lg-4">
                <div class="card initial-status-card">
                    <div class="status-header"><i class="fas fa-exclamation-triangle"></i> Problemas Relatados</div>
                    <div id="problem-list-container" class="initial-list-container">
                        <div class="empty-message">Nenhum problema relatado.</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal: escolher o atendente que vai assumir o problema -->
    <div id="attendantModal" class="modal fade custom-modal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title"><i class="fas fa-headset"></i> Iniciar Atendimento</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
                </div>
                <div class="modal-body">
                    <div class="form-group">
                        <label for="attendantSelect">Selecione o Atendente:</label>
                        <select class="form-control" id="attendantSelect">
                            <option value="outro">Outro</option>
                        </select>
                    </div>
                    <div class="form-group mt-3" id="otherAttendantGroup" hidden>
                        <label for="attendantName">Nome do Atendente:</label>
                        <input type="text" class="form-control" id="attendantName" placeholder="Digite o nome do atendente">
                    </div>
                    <div class="text-danger small mt-2" id="attendantError" hidden></div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-success" id="confirmAttendBtn"><i class="fas fa-check"></i> Confirmar</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal: finalizar atendimento (e registrar card, se houver) -->
    <div id="endChatModal" class="modal fade custom-modal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title"><i class="fas fa-check-circle"></i> Finalizar Atendimento</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
                </div>
                <div class="modal-body">
                    <div class="form-group">
                        <label for="cardCreatedSelect">Foi necessário criar um card?</label>
                        <select class="form-control" id="cardCreatedSelect">
                            <option value="no">Não</option>
                            <option value="yes">Sim</option>
                        </select>
                    </div>
                    <div class="form-group mt-3" id="cardLinkGroup" hidden>
                        <label for="cardLink">Link do Card:</label>
                        <input type="text" class="form-control" id="cardLink" placeholder="Cole o link do card aqui">
                    </div>
                    <div class="text-danger small mt-2" id="endChatError" hidden></div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-success" id="confirmEndBtn"><i class="fas fa-check"></i> Confirmar</button>
                </div>
            </div>
        </div>
    </div>

    <script src="/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="/pages/overview/overview.js"></script>
</body>
</html>
